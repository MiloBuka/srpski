<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Srpski">
<meta name="theme-color" content="#2747A6">
<title>Pitanja · Srpski</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;600;700&display=swap">
<style>
/* Layout: one-screen trainer — mode switch (cards / table), verb picker, flip card, know/don't-know bar */
:root{
  --bg:#E8ECF1; --surface:#FFFFFF; --ink:#18233A; --muted:#5C6880; --line:#CDD4DF;
  --accent:#2747A6; --accent-soft:#DCE3F7; --end:#C2410C;
  --yes:#1F7A4D; --yes-soft:#DDF1E6; --no:#B23A2E; --no-soft:#F8E0DC;
  --f-num:"Unbounded", "Arial Black", system-ui, sans-serif;
  --f-body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F141C; --surface:#1A2230; --ink:#E6EBF3; --muted:#9AA6BA; --line:#2C3748; --end:#FDBA74;
  --accent:#8EA8F5; --accent-soft:#25325A; --yes:#5CC995; --yes-soft:#16362A; --no:#F08A7E; --no-soft:#3E1F1C; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F141C; --surface:#1A2230; --ink:#E6EBF3; --muted:#9AA6BA; --line:#2C3748; --end:#FDBA74;
  --accent:#8EA8F5; --accent-soft:#25325A; --yes:#5CC995; --yes-soft:#16362A; --no:#F08A7E; --no-soft:#3E1F1C; color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;margin:0}
.app{max-width:540px;margin:0 auto;padding-block:14px 18px;padding-inline:16px;display:flex;flex-direction:column;gap:12px;min-height:100%}
header{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
h1{font-family:var(--f-num);font-weight:700;font-size:20px;margin:0}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font:600 13px var(--f-body);padding:8px 6px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 200px}
select{width:100%;font:600 14px var(--f-body);padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.stats{display:flex;gap:6px;font-size:13px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.chip{padding:4px 10px;border-radius:99px;font-weight:600}
.chip.y{background:var(--yes-soft);color:var(--yes)} .chip.n{background:var(--no-soft);color:var(--no)} .chip.u{background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}

.stage{flex:1;min-height:320px;display:flex}
.card{position:relative;flex:1;min-height:320px;cursor:pointer;border-radius:20px}
.face{position:absolute;top:0;left:0;right:0;bottom:0;background:var(--surface);border:1px solid var(--line);border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 20px 36px;text-align:center;gap:10px;transition:opacity .25s,transform .25s}
.card.flipped .front,.card:not(.flipped) .back{opacity:0;visibility:hidden;transform:scale(.97)}
.card.st-yes .face{box-shadow:inset 0 -5px 0 var(--yes)} .card.st-no .face{box-shadow:inset 0 -5px 0 var(--no)}
.pron{font-family:var(--f-num);font-weight:700;font-size:clamp(40px,13vw,64px);line-height:1;color:var(--accent)}
.inf{font-family:var(--f-num);font-weight:500;font-size:clamp(24px,7vw,32px)}
.ru{color:var(--muted);font-size:15px}
.form{font-family:var(--f-num);font-weight:500;font-size:clamp(30px,9vw,44px);line-height:1.15;overflow-wrap:anywhere}
.form b{color:var(--end);font-weight:700}
.ex{font-size:14px;background:var(--accent-soft);padding:8px 12px;border-radius:10px;max-width:34ch;line-height:1.4}
.ex span{display:block;color:var(--muted);font-size:13px}
.tip{font-size:13px;color:var(--muted);max-width:32ch;line-height:1.4}
.hint{position:absolute;bottom:14px;left:0;right:0;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.tag{position:absolute;top:14px;left:16px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.speak{border:1px solid var(--line);background:var(--bg);color:var(--accent);border-radius:99px;padding:9px 16px;font:700 14px var(--f-body);cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.speak svg{width:18px;height:18px}
.nav{display:grid;grid-template-columns:52px 1fr 1fr 52px;gap:8px}
.nav button{border:0;border-radius:14px;padding:16px 8px;font:700 15px var(--f-body);cursor:pointer}
.nav .arrow{background:var(--surface);color:var(--ink);border:1px solid var(--line);font-size:20px;padding:0}
.nav .no{background:var(--no-soft);color:var(--no)} .nav .yes{background:var(--yes-soft);color:var(--yes)}
.tools{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.tools label{display:flex;gap:6px;align-items:center;cursor:pointer}
.link{background:none;border:0;color:var(--muted);font:600 13px var(--f-body);text-decoration:underline;cursor:pointer;padding:4px}
.empty{color:var(--muted);font-size:16px;max-width:26ch;line-height:1.4}
.voice{font-size:12px;color:var(--muted);text-align:center;min-height:1em}

/* table view */
.tbl{display:flex;flex-direction:column;gap:10px}
.rule{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;line-height:1.5}
.rule h2{font:700 15px var(--f-body);margin:0 0 6px}
.ends{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,auto);grid-auto-flow:column;gap:4px;text-align:center;font-variant-numeric:tabular-nums;margin-top:8px}
.ends div{background:var(--bg);border-radius:8px;padding:6px 2px;font-size:12px;color:var(--muted)}
.ends div{display:flex;justify-content:space-between;align-items:baseline;padding:6px 10px!important;text-align:left}
.ends div b{color:var(--end);font-size:15px}
.vcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.vhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.vhead strong{font-family:var(--f-num);font-weight:500;font-size:18px}
.vhead span{color:var(--muted);font-size:13px}
.conj{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto auto auto auto;grid-auto-flow:column;gap:2px 16px;margin-top:8px;font-size:15px}
.conj .h{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);cursor:default;padding:0 0 2px;border-bottom:1px solid var(--line)}
.conj div{display:flex;flex-direction:column;gap:1px;cursor:pointer;padding:5px 0;min-width:0}
.conj i{font-style:normal;color:var(--muted);font-size:11px;line-height:1.2}
.conj span{font-size:16px}
.conj b{color:var(--end)}
.vnote{font-size:13px;color:var(--muted);margin-top:6px}
button:focus-visible,select:focus-visible,input:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.face,.bar i{transition:none}}
.home{color:var(--muted);font:600 13px var(--f-body);text-decoration:none;align-self:flex-start}.home:hover{color:var(--accent)}

.mini{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:repeat(4,auto);grid-auto-flow:column;gap:2px 18px;width:100%;max-width:300px;text-align:left;margin-top:4px}
.mini .h{border-radius:0;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:2px}
.mini div{display:flex;flex-direction:column;padding:3px 6px;border-radius:8px;min-width:0}
.mini i{font-style:normal;font-size:10px;color:var(--muted);line-height:1.2}
.mini span{font-size:14px}
.mini b{color:var(--end)}
.mini .on{background:var(--accent-soft)}
.mini .on span{font-weight:700}
.who{font-size:13px;color:var(--accent);font-weight:700}
.q{font-size:13px;color:var(--muted)}
.inf2{font-family:var(--f-num);font-weight:500;font-size:clamp(28px,8vw,38px);line-height:1.1}

.qsr{font-family:var(--f-num);font-weight:500;font-size:clamp(24px,7vw,34px);line-height:1.2;text-wrap:balance}
.qsr b{color:var(--end);font-weight:700}
.qru{font-family:var(--f-num);font-weight:500;font-size:clamp(26px,7.5vw,36px);line-height:1.2;text-wrap:balance}
.ans{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--accent-soft);border-radius:14px;padding:10px 14px;max-width:34ch}
.ans .lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.ans .sr{font-size:17px;font-weight:700}
.ans .ru2{font-size:13px;color:var(--muted)}
.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.speak.sm{padding:7px 12px;font-size:13px}
.word{font-size:13px;color:var(--accent);font-weight:700}
</style>
</head>
<body>
<div class="app">
  <a class="home" href="./">← Все тренажёры</a>
  <header><h1>Pitanja</h1><span class="count" id="count"></span></header>
  <div class="row">
    <select id="qw" aria-label="Вопросительное слово"></select>
    <div class="seg" role="group" aria-label="Порядок">
      <button id="m-order" aria-pressed="true">По порядку</button>
      <button id="m-shuffle" aria-pressed="false">Вперемешку</button>
    </div>
  </div>
  <div class="seg" role="group" aria-label="Какие карточки">
    <button id="f-all" aria-pressed="true">Все</button>
    <button id="f-no" aria-pressed="false">Не знаю</button>
    <button id="f-new" aria-pressed="false">Новые</button>
  </div>
  <div class="stats"><span class="chip y" id="s-yes"></span><span class="chip n" id="s-no"></span><span class="chip u" id="s-new"></span></div>
  <div class="bar"><i id="bar"></i></div>
  <div class="stage">
    <div class="card" id="card" tabindex="0" role="button" aria-label="Перевернуть карточку">
      <div class="face front" id="front"></div>
      <div class="face back" id="back"></div>
    </div>
  </div>
  <div class="voice" id="voice"></div>
  <div class="nav">
    <button class="arrow" id="prev" aria-label="Назад">‹</button>
    <button class="no" id="no">Не знаю</button>
    <button class="yes" id="yes">Знаю</button>
    <button class="arrow" id="next" aria-label="Вперёд">›</button>
  </div>
  <div class="tools">
    <label><input type="checkbox" id="auto"> Озвучивать при перевороте</label>
    <button class="link" id="reset">Сбросить отметки</button>
  </div>
</div>
<script>
const WORDS={"Koliko":"сколько","Gde":"где","Odakle":"откуда","Kako":"как","Zašto":"почему, зачем","Ko":"кто","Šta":"что","S kim":"с кем","Kada":"когда","Da li":"…ли (вопрос да/нет)"};
const Q=[
 ["Koliko","Сколько тебе лет?","Koliko imaš godina?","Imam trideset godina.","Мне тридцать лет.","Возраст по-сербски «имеют»: imam 30 godina."],
 ["Koliko","Сколько стоит кофе?","Koliko košta kafa?","Kafa košta dvesta dinara.","Кофе стоит двести динаров."],
 ["Gde","Где ты живёшь?","Gde živiš?","Živim u Beogradu.","Я живу в Белграде."],
 ["Gde","Где работает Марко?","Gde radi Marko?","Marko radi u banci.","Марко работает в банке."],
 ["Odakle","Откуда ты?","Odakle si?","Ja sam iz Rusije.","Я из России.","si, ste — формы глагола biti: ja sam, ti si, vi ste."],
 ["Odakle","Откуда вы?","Odakle ste?","Mi smo iz Kazahstana.","Мы из Казахстана.","Vi ste — и «вы» многие, и вежливое «Вы»."],
 ["Kako","Как дела?","Kako si?","Dobro sam, hvala.","Хорошо, спасибо."],
 ["Kako","Как тебя зовут?","Kako se zoveš?","Zovem se Ana.","Меня зовут Ана.","Буквально «как ты себя зовёшь?»"],
 ["Zašto","Почему ты учишь сербский?","Zašto učiš srpski?","Zato što živim u Srbiji.","Потому что я живу в Сербии.","Zašto? — Zato što… («почему? — потому что…»)"],
 ["Zašto","Почему ты не бегаешь?","Zašto ne trčiš?","Zato što ne volim da trčim.","Потому что не люблю бегать.","«Люблю бегать» = volim da trčim: после da второй глагол тоже спрягается."],
 ["Ko","Кто говорит по-сербски?","Ko govori srpski?","Moja učiteljica govori srpski.","Моя учительница говорит по-сербски."],
 ["Ko","Кто убирает квартиру?","Ko čisti stan?","Marko i ja čistimo stan.","Мы с Марко убираем квартиру.","Ko? — глагол после него в форме «он»: ko čisti, ko radi."],
 ["Šta","Что ты делаешь?","Šta radiš?","Učim srpski.","Учу сербский."],
 ["Šta","Что ты любишь?","Šta voliš?","Volim more i kafu.","Люблю море и кофе."],
 ["Šta","Что ты видишь?","Šta vidiš?","Vidim ptice.","Вижу птиц."],
 ["S kim","С кем ты живёшь?","S kim živiš?","Živim sa Markom.","Я живу с Марко.","s и sa — одно и то же «с»."],
 ["S kim","С кем ты учишь сербский?","S kim učiš srpski?","Učim srpski s mamom.","Учу сербский с мамой."],
 ["Kada","Когда ты просыпаешься?","Kada se budiš?","Budim se u sedam.","Просыпаюсь в семь.","В вопросе se тоже идёт вторым: Kada se budiš?"],
 ["Kada","Когда вы летите в Москву?","Kada letite za Moskvu?","Letimo u petak.","Летим в пятницу."],
 ["Da li","Ты говоришь по-сербски?","Da li govoriš srpski?","Da, malo.","Да, немного.","Da li — в начало, дальше обычный порядок слов."],
 ["Da li","Ты хочешь кофе?","Da li želiš kafu?","Da, hvala.","Да, спасибо."],
 ["Da li","Ты любишь бегать?","Da li voliš da trčiš?","Ne, ne volim.","Нет, не люблю."]
].map((r,i)=>({id:i,w:r[0],ru:r[1],sr:r[2],a:r[3],aru:r[4],note:r[5]}));
const esc=t=>t.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const hl=q=>{const w=q.w;const s=q.sr;return s.startsWith(w)?"<b>"+esc(w)+"</b>"+esc(s.slice(w.length)):esc(s)};
const KEY="pitanja-v1";
let S={marks:{},mode:"order",filter:"all",word:"all",auto:false};
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const sel=$("qw");
sel.innerHTML='<option value="all">Все 10 слов</option>'+Object.keys(WORDS).map(w=>`<option value="${w}">${w} — ${WORDS[w]}</option>`).join("");
let deck=[],idx=0,shuffleOrder=null;
function build(){
  let base=Q.map((_,i)=>i);
  if(S.mode==="shuffle"){
    if(!shuffleOrder){shuffleOrder=base.slice();for(let i=shuffleOrder.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[shuffleOrder[i],shuffleOrder[j]]=[shuffleOrder[j],shuffleOrder[i]]}}
    base=shuffleOrder.slice();
  }
  if(S.word!=="all")base=base.filter(i=>Q[i].w===S.word);
  if(S.filter==="no")base=base.filter(i=>S.marks[i]==="no");
  if(S.filter==="new")base=base.filter(i=>!S.marks[i]);
  deck=base;
}
const card=$("card");
const ico='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
function render(){
  for(const [id,k,v] of [["m-order","mode","order"],["m-shuffle","mode","shuffle"],["f-all","filter","all"],["f-no","filter","no"],["f-new","filter","new"]])
    $(id).setAttribute("aria-pressed",S[k]===v);
  sel.value=S.word;$("auto").checked=S.auto;
  const pool=S.word==="all"?Q:Q.filter(q=>q.w===S.word);
  const y=pool.filter(q=>S.marks[q.id]==="yes").length,n=pool.filter(q=>S.marks[q.id]==="no").length;
  $("s-yes").textContent="Знаю: "+y;$("s-no").textContent="Не знаю: "+n;$("s-new").textContent="Новые: "+(pool.length-y-n);
  $("bar").style.width=(pool.length?y/pool.length*100:0)+"%";
  card.classList.remove("flipped","st-yes","st-no");
  if(!deck.length){
    const msg=S.filter==="no"?"Карточек с отметкой «Не знаю» нет. Отлично!":"Новых карточек не осталось — все отмечены.";
    $("front").innerHTML=`<div class="empty">${msg}</div>`;$("back").innerHTML="";$("count").textContent="0 / 0";return;
  }
  idx=Math.max(0,Math.min(idx,deck.length-1));
  const q=Q[deck[idx]],m=S.marks[q.id];
  if(m)card.classList.add("st-"+m);
  $("count").textContent=(idx+1)+" / "+deck.length;
  const tag=m==="yes"?"знаю":m==="no"?"не знаю":"новая";
  $("front").innerHTML=`<span class="tag">${tag}</span><span class="qru">${q.ru}</span><span class="q">Спроси по-сербски</span><span class="hint">нажми, чтобы перевернуть</span>`;
  $("back").innerHTML=`<span class="tag">${tag}</span><span class="word">${q.w}? — ${WORDS[q.w]}</span><span class="qsr">${hl(q)}</span>
   <div class="btns"><button class="speak sm" data-say="q">${ico}Вопрос</button><button class="speak sm" data-say="a">${ico}Ответ</button></div>
   <div class="ans"><span class="lbl">Пример ответа</span><span class="sr">${q.a}</span><span class="ru2">${q.aru}</span></div>
   ${q.note?`<span class="tip">${q.note}</span>`:""}`;
}
let voice=null,ttsOK=false;
function pickVoice(){try{const vs=speechSynthesis.getVoices()||[];
  voice=vs.find(v=>/^sr/i.test(v.lang))||vs.find(v=>/^hr/i.test(v.lang))||vs.find(v=>/^bs/i.test(v.lang))||null;
  $("voice").textContent=!vs.length?"":voice?"Голос: "+voice.name:"Сербского голоса на устройстве нет — читает голос по умолчанию";}catch(e){}}
function initSpeech(){try{if(window.speechSynthesis&&window.SpeechSynthesisUtterance){ttsOK=true;pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
  else $("voice").textContent="Озвучка не работает в этом браузере — открой ссылку в Safari или Chrome"}catch(e){}}
function say(t){if(!ttsOK)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);if(voice){u.voice=voice;u.lang=voice.lang}else u.lang="sr-RS";u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
const cur=()=>Q[deck[idx]];
function flip(){if(!deck.length)return;card.classList.toggle("flipped");if(S.auto&&card.classList.contains("flipped"))say(cur().sr)}
card.addEventListener("click",e=>{const b=e.target.closest("[data-say]");if(b){e.stopPropagation();say(b.dataset.say==="q"?cur().sr:cur().a);return}flip()});
card.addEventListener("keydown",e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();flip()}});
function go(s){if(!deck.length)return;idx=(idx+s+deck.length)%deck.length;render()}
$("prev").onclick=()=>go(-1);$("next").onclick=()=>go(1);
function mark(val){if(!deck.length)return;const c=deck[idx];S.marks[c]=val;save();build();
  if(deck.includes(c)){idx=deck.indexOf(c)+1;if(idx>=deck.length)idx=0}render()}
$("yes").onclick=()=>mark("yes");$("no").onclick=()=>mark("no");
const set=(k,v)=>{S[k]=v;save();if(k==="mode"&&v==="shuffle")shuffleOrder=null;build();idx=0;render()};
$("m-order").onclick=()=>set("mode","order");$("m-shuffle").onclick=()=>set("mode","shuffle");
$("f-all").onclick=()=>set("filter","all");$("f-no").onclick=()=>set("filter","no");$("f-new").onclick=()=>set("filter","new");
sel.onchange=()=>set("word",sel.value);
$("auto").onchange=e=>{S.auto=e.target.checked;save()};
let armed=false;
$("reset").onclick=()=>{if(!armed){armed=true;$("reset").textContent="Точно сбросить?";setTimeout(()=>{armed=false;$("reset").textContent="Сбросить отметки"},3000);return}
  armed=false;S.marks={};save();$("reset").textContent="Сбросить отметки";build();idx=0;render()};
document.addEventListener("keydown",e=>{if(/INPUT|SELECT/.test(e.target.tagName))return;if(e.key==="ArrowRight")go(1);if(e.key==="ArrowLeft")go(-1)});
let tx=null;
card.addEventListener("touchstart",e=>{tx=e.touches[0].clientX},{passive:true});
card.addEventListener("touchend",e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>60){e.preventDefault();go(dx<0?1:-1)}});
try{build();render()}catch(e){S={marks:{},mode:"order",filter:"all",word:"all",auto:false};shuffleOrder=null;build();render()}
initSpeech();
</script>
</body>
</html>
