const KEY="glagoli-a-v1";
let S={marks:{},mode:"order",filter:"all",auto:false,view:"cards",verb:"all"};
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
let deck=[],idx=0,shuffleOrder=null,person=0,lastPerson=-1;
const roll=()=>{let p;do{p=Math.random()*6|0}while(p===lastPerson);lastPerson=p;person=p;const o=PRON[p];pron=o[Math.random()*o.length|0]};
function build(){
  let base=VERBS.map((_,i)=>i);
  if(S.mode==="shuffle"){
    if(!shuffleOrder){shuffleOrder=base.slice();for(let i=shuffleOrder.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[shuffleOrder[i],shuffleOrder[j]]=[shuffleOrder[j],shuffleOrder[i]]}}
    base=shuffleOrder.slice();
  }
  if(S.filter==="no")base=base.filter(i=>S.marks[VERBS[i].inf]==="no");
  if(S.filter==="new")base=base.filter(i=>!S.marks[VERBS[i].inf]);
  deck=base;
}
const card=$("card");
const speakBtn=`<button class="speak" data-speak><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>Слушать</button>`;
function renderTable(){
  const list=S.verb==="all"?VERBS.map((v,i)=>i):[+S.verb];
  $("tableView").innerHTML=`<div class="rule"><h2>Одна схема на все 24</h2>Отбрось <b>-ati</b> и добавь окончание. Нажми на форму, чтобы услышать.
   <div class="ends">${PR.map(p=>`<div><span>${p[0]}</span><b>-${p[2]}</b></div>`).join("")}</div></div>`+
   list.map(i=>{const v=VERBS[i];return `<div class="vcard"><div class="vhead"><strong>${v.inf}</strong><span>${v.ru}</span></div>
   <div class="conj"><div class="h">Ед. число</div>${PR.slice(0,3).map((p,pi)=>`<div data-say="${tSay(v,pi)}"><i>${p[0].replace(/ \/ /g,"/")}</i><span>${formHTML(v,pi)}</span></div>`).join("")}<div class="h">Мн. число</div>${PR.slice(3).map((p,k)=>{const pi=k+3;return `<div data-say="${tSay(v,pi)}"><i>${p[0].replace(/ \/ /g,"/")}</i><span>${formHTML(v,pi)}</span></div>`}).join("")}</div>
   <div class="vnote">${v.ex} — ${v.exru}${v.note?"<br>"+v.note:""}</div></div>`}).join("");
}
function render(){
  for(const [id,k,v] of [["m-order","mode","order"],["m-shuffle","mode","shuffle"],["f-all","filter","all"],["f-no","filter","no"],["f-new","filter","new"],["v-table","view","table"],["v-cards","view","cards"]])
    $(id).setAttribute("aria-pressed",S[k]===v);
  $("auto").checked=S.auto;
  const isT=S.view==="table";
  $("tableView").hidden=!isT;$("cardsView").style.display=isT?"none":"contents";$("verb").hidden=!isT;$("verb").value=S.verb;
  if(isT){renderTable();$("count").textContent="";return}
  const y=VERBS.filter(v=>S.marks[v.inf]==="yes").length,n=VERBS.filter(v=>S.marks[v.inf]==="no").length;
  $("s-yes").textContent="Знаю: "+y;$("s-no").textContent="Не знаю: "+n;$("s-new").textContent="Новые: "+(VERBS.length-y-n);
  $("bar").style.width=(y/VERBS.length*100)+"%";
  card.classList.remove("flipped","st-yes","st-no");
  if(!deck.length){
    const msg=S.filter==="no"?"Карточек с отметкой «Не знаю» нет. Отлично!":"Новых карточек не осталось — все отмечены.";
    $("front").innerHTML=`<div class="empty">${msg}</div>`;$("back").innerHTML="";$("count").textContent="0 / 0";return;
  }
  idx=Math.max(0,Math.min(idx,deck.length-1));
  const v=VERBS[deck[idx]],m=S.marks[v.inf];
  if(m)card.classList.add("st-"+m);
  $("count").textContent=(idx+1)+" / "+deck.length;
  const tag=m==="yes"?"знаю":m==="no"?"не знаю":"новая";
  $("front").innerHTML=`<span class="tag">${tag}</span><span class="form">${pron[1]} ${RU[v.inf][person]}</span>${v.hint?`<span class="q">(${v.hint})</span>`:""}<span class="q">Как это сказать по-сербски?</span><span class="hint">нажми, чтобы перевернуть</span>`;
  const cell=pi=>`<div class="${pi===person?"on":""}"><i>${PR[pi][0].replace(/ \/ /g,"/")}</i><span>${formHTML(v,pi)}</span></div>`;
  $("back").innerHTML=`<span class="tag">${tag}</span><span class="form">${pron[0]}${v.se?" se":""} ${v.st}<b>${PR[person][2]}</b></span>
   ${v.se?`<span class="q">без местоимения: ${formTxt(v,person)}</span>`:""}${speakBtn}
   <span class="who">${v.inf} — ${v.ru}</span>
   <div class="mini"><div class="h">Ед. число</div>${[0,1,2].map(cell).join("")}<div class="h">Мн. число</div>${[3,4,5].map(cell).join("")}</div>`;
}
let voice=null,ttsOK=false;
function pickVoice(){try{const vs=speechSynthesis.getVoices()||[];
  voice=vs.find(v=>/^sr/i.test(v.lang))||vs.find(v=>/^hr/i.test(v.lang))||vs.find(v=>/^bs/i.test(v.lang))||null;
  $("voice").textContent=!vs.length?"":voice?"Голос: "+voice.name:"Сербского голоса на устройстве нет — читает голос по умолчанию";}catch(e){}}
function initSpeech(){try{if(window.speechSynthesis&&window.SpeechSynthesisUtterance){ttsOK=true;pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
  else $("voice").textContent="Озвучка не работает в этом браузере — открой ссылку в Safari или Chrome"}catch(e){}}
function say(t){if(!ttsOK)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);if(voice){u.voice=voice;u.lang=voice.lang}else u.lang="sr-RS";u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
const cur=()=>VERBS[deck[idx]];
function flip(){if(!deck.length)return;card.classList.toggle("flipped");if(S.auto&&card.classList.contains("flipped"))say(sayTxt(cur(),person))}
card.addEventListener("click",e=>{if(e.target.closest("[data-speak]")){e.stopPropagation();say(sayTxt(cur(),person));return}flip()});
card.addEventListener("keydown",e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();flip()}});
function go(s){if(!deck.length)return;idx=(idx+s+deck.length)%deck.length;roll();render()}
$("prev").onclick=()=>go(-1);$("next").onclick=()=>go(1);
function mark(val){if(!deck.length)return;const c=deck[idx];S.marks[VERBS[c].inf]=val;save();build();
  if(deck.includes(c)){idx=deck.indexOf(c)+1;if(idx>=deck.length)idx=0}roll();render()}
$("yes").onclick=()=>mark("yes");$("no").onclick=()=>mark("no");
const vsel=$("verb");
vsel.innerHTML='<option value="all">Все 24 глагола</option>'+VERBS.map((v,i)=>`<option value="${i}">${v.inf} — ${v.ru}</option>`).join("");
vsel.onchange=()=>{S.verb=vsel.value;save();render()};
$("v-table").onclick=()=>{S.view="table";save();render()};
$("v-cards").onclick=()=>{S.view="cards";save();roll();render()};
$("tableView").addEventListener("click",e=>{const d=e.target.closest("[data-say]");if(d)say(d.dataset.say)});
const set=(k,v)=>{S[k]=v;save();if(k==="mode"&&v==="shuffle")shuffleOrder=null;build();idx=0;roll();render()};
$("m-order").onclick=()=>set("mode","order");$("m-shuffle").onclick=()=>set("mode","shuffle");
$("f-all").onclick=()=>set("filter","all");$("f-no").onclick=()=>set("filter","no");$("f-new").onclick=()=>set("filter","new");
$("auto").onchange=e=>{S.auto=e.target.checked;save()};
let armed=false;
$("reset").onclick=()=>{if(!armed){armed=true;$("reset").textContent="Точно сбросить?";setTimeout(()=>{armed=false;$("reset").textContent="Сбросить отметки"},3000);return}
  armed=false;S.marks={};save();$("reset").textContent="Сбросить отметки";build();idx=0;roll();render()};
document.addEventListener("keydown",e=>{if(/INPUT|SELECT/.test(e.target.tagName)||S.view==="table")return;if(e.key==="ArrowRight")go(1);if(e.key==="ArrowLeft")go(-1)});
let tx=null;
card.addEventListener("touchstart",e=>{tx=e.touches[0].clientX},{passive:true});
card.addEventListener("touchend",e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>60){e.preventDefault();go(dx<0?1:-1)}});
try{build();roll();render()}catch(e){S={marks:{},mode:"order",filter:"all",auto:false,view:"cards",verb:"all"};shuffleOrder=null;build();roll();render()}
initSpeech();
</script>
</body>
</html>
